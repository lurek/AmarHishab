name: Build & Release Versioned Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Publish Versioned Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository (with Full Tags History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Next Unique Release Version
        id: calc_version
        run: |
          git fetch --tags --force
          BASE_VER=$(node -p "require('./package.json').version || '3.9'")
          # Strip any trailing .0 if format is X.Y.0
          BASE_SHORT=$(echo "$BASE_VER" | sed -E 's/^([0-9]+\.[0-9]+)\.0$/\1/')

          # If v${BASE_SHORT} does not exist yet as a tag, use it directly.
          # Otherwise, auto-increment patch version (v3.9.1, v3.9.2, etc.) so old releases are NEVER overwritten!
          if ! git rev-parse "v${BASE_SHORT}" >/dev/null 2>&1; then
            NEXT_VER="${BASE_SHORT}"
          else
            PATCH=1
            while git rev-parse "v${BASE_SHORT}.${PATCH}" >/dev/null 2>&1; do
              PATCH=$((PATCH + 1))
            done
            NEXT_VER="${BASE_SHORT}.${PATCH}"
          fi

          VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          APK_FILENAME="AmarHishab-v${NEXT_VER}.apk"
          VERSIONED_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${NEXT_VER}/${APK_FILENAME}"
          LATEST_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/AmarHishab-Release.apk"

          echo "version=${NEXT_VER}" >> $GITHUB_OUTPUT
          echo "tag=v${NEXT_VER}" >> $GITHUB_OUTPUT
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "apk_filename=${APK_FILENAME}" >> $GITHUB_OUTPUT
          echo "versioned_url=${VERSIONED_URL}" >> $GITHUB_OUTPUT
          echo "latest_url=${LATEST_URL}" >> $GITHUB_OUTPUT

          echo "Calculated Release Version: v${NEXT_VER} (versionCode: ${VERSION_CODE})"

      - name: Inject Version & Latest APK Links into Web & Android Config
        run: |
          VER="${{ steps.calc_version.outputs.version }}"
          TAG="${{ steps.calc_version.outputs.tag }}"
          CODE="${{ steps.calc_version.outputs.version_code }}"
          VER_URL="${{ steps.calc_version.outputs.versioned_url }}"
          LAT_URL="${{ steps.calc_version.outputs.latest_url }}"
          NOW_ISO=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # 1. Generate public/version.json for automatic web/app version discovery
          cat <<EOF > public/version.json
          {
            "version": "${VER}",
            "tag": "${TAG}",
            "versionCode": ${CODE},
            "apkUrl": "${VER_URL}",
            "latestUrl": "${LAT_URL}",
            "releasesPageUrl": "https://github.com/${GITHUB_REPOSITORY}/releases",
            "updatedAt": "${NOW_ISO}"
          }
          EOF

          # 2. Update APP_VERSION in public/script.js and CACHE_NAME in public/sw.js
          sed -i -E "s/const APP_VERSION = '[^']+';/const APP_VERSION = '${VER}';/g" public/script.js
          sed -i -E "s/jomakhoroch-cache-v[0-9.]+/jomakhoroch-cache-v${VER}/g" public/sw.js

          # 3. Update version labels and links in public/index.html
          sed -i -E "s/APK ডাউনলোড \(v[0-9.]+\)/APK ডাউনলোড (${TAG})/g" public/index.html
          sed -i -E "s/ডাউনলোড করুন \(v[0-9.]+\)/ডাউনলোড করুন (${TAG})/g" public/index.html
          sed -i -E "s/AmarHishab v[0-9.]+/AmarHishab ${TAG}/g" public/index.html
          sed -i -E "s/<span class=\"latest-version-tag\">v[0-9.]+<\/span>/<span class=\"latest-version-tag\">${TAG}<\/span>/g" public/index.html
          sed -i -E "s/style\.css\?v=[0-9.]+/style.css?v=${VER}/g" public/index.html
          sed -i -E "s/script\.js\?v=[0-9.]+/script.js?v=${VER}/g" public/index.html

          # 4. Update Android build.gradle versionCode & versionName
          sed -i -E "s/versionCode [0-9]+/versionCode ${CODE}/g" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"${VER}\"/g" android/app/build.gradle

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission to Gradlew
        run: |
          cd android
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build Signed Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Package Versioned APK & Latest Release Alias
        run: |
          mkdir -p build_output
          APK_FILE="${{ steps.calc_version.outputs.apk_filename }}"
          SRC_APK=$(ls android/app/build/outputs/apk/release/*-release.apk 2>/dev/null | head -n 1 || ls android/app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$SRC_APK" "build_output/${APK_FILE}"
          cp "$SRC_APK" "build_output/AmarHishab-Release.apk"
          ls -lh build_output/

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AmarHishab-${{ steps.calc_version.outputs.tag }}-APK
          path: build_output/
          retention-days: 30

      - name: Publish New GitHub Release (Preserves All Previous Releases)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ steps.calc_version.outputs.tag }}
          name: AmarHishab ${{ steps.calc_version.outputs.tag }} Release
          make_latest: true
          generate_release_notes: true
          body: |
            ## 💰 AmarHishab (আমারহিসাব) ${{ steps.calc_version.outputs.tag }} Release
            - 📥 **Direct Versioned APK**: [`${{ steps.calc_version.outputs.apk_filename }}`](${{ steps.calc_version.outputs.versioned_url }})
            - 🔗 **Universal Latest APK Link**: [`AmarHishab-Release.apk`](${{ steps.calc_version.outputs.latest_url }})
            - 🗂️ **Previous Versions**: All older versions remain preserved in the [Releases Archive](https://github.com/${{ github.repository }}/releases).
          files: |
            build_output/${{ steps.calc_version.outputs.apk_filename }}
            build_output/AmarHishab-Release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-Deploy Updated Version & Links to Firebase Hosting
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && (env.FIREBASE_SA != '')
        continue-on-error: true
        uses: FirebaseExtended/action-hosting-deploy@v0
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JOMAKHOROCH_5AC13 || secrets.FIREBASE_SERVICE_ACCOUNT }}
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JOMAKHOROCH_5AC13 || secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: jomakhoroch-5ac13
