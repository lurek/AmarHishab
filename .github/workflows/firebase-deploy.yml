name: Deploy to Firebase Hosting

on:
  workflow_run:
    workflows: ["Build & Release Versioned Android APK"]
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy_hosting:
    name: Deploy to Firebase Hosting
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JOMAKHOROCH_5AC13 || secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: jomakhoroch-5ac13
